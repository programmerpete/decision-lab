name: Checks and Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy
    needs: checks
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Creating a Pages site through the API is refused for this repository even with
      # `pages: write` on the workflow token, so the first enablement needs a repository
      # owner. Fail with the instruction instead of a bare 403.
      - name: Check that Pages is enabled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")

          if [ "$status" = "200" ]; then
            echo "Pages is enabled for ${{ github.repository }}."
            exit 0
          fi

          echo "::error title=GitHub Pages is not enabled::Publishing needs one manual step."
          {
            echo "## GitHub Pages is not enabled"
            echo
            echo "The site is built and the checks pass, but nothing can be published until"
            echo "Pages exists for this repository, and the workflow token cannot create it."
            echo
            echo "An owner needs to do this once:"
            echo
            echo "1. Open **Settings → Pages**."
            echo "2. Under **Build and deployment → Source**, choose **GitHub Actions**."
            echo
            echo "Do **not** choose *Deploy from a branch*. This workflow publishes an artifact,"
            echo "and a branch-based source would serve the wrong thing."
            echo
            echo "Then re-run this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # A no-op once Pages exists, and it saves the manual step on repositories where
      # the workflow token is allowed to create the site.
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
